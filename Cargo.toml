[package]
name = "agent-vocal-studio"
version = "0.99.0"
edition = "2021"
description = "A local, agent-first vocal piano-roll editor"
license = "MIT"
repository = "https://github.com/Misaoys/agent-vocal-studio"
default-run = "agent-vocal-studio"

[[bin]]
name = "agent-vocal-studio"
path = "src/main.rs"

[[bin]]
name = "agent-vocal-desktop"
path = "src/bin/desktop.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
midly = "0.5"
hound = "3.5"
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "mp3"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rustysynth = "=1.3.8"
sha2 = "0.10"
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
cpal = "=0.17.3"
wry = "=0.57.2"
tao = "=0.37.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security"] }

[build-dependencies]
winresource = "=0.1.34"

[profile.release]
strip = true
lto = "thin"
